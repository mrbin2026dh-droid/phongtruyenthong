<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tri ân Thầy Cô 20.11 · THCS Chu Văn An</title>
<meta name="description" content="Ảnh kỷ niệm tri ân thầy cô nhân ngày Nhà giáo Việt Nam 20/11 — Trường THCS Chu Văn An, xã Đăk Hà, tỉnh Quảng Ngãi.">
<meta property="og:title" content="Tri ân Thầy Cô · 20.11">
<meta property="og:description" content="Ảnh kỷ niệm của Trường THCS Chu Văn An — lưu về máy hoặc gửi qua Zalo.">
<meta property="og:image" content="https://truyenthongchuvanan.online/tri-an/tri-an-thay-co-20-11.jpg">
<meta name="theme-color" content="#0e2b2f">
<link rel="icon" href="../favicon.svg">
<!-- 17/11: trang mã QR ở màn hình đang tải dẫn tới — thầy cô lưu ảnh tranh khảm tri ân làm kỷ niệm / gửi Zalo. -->
<style>
:root{--bg:#0e2b2f;--bg2:#163a3f;--gold:#e1c286;--gold2:#b8924f;--ink:#f3e4c4;--muted:#bdceca}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{min-height:100dvh;font:400 15px/1.6 "Noto Sans","Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 65%) fixed;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:1040px;margin:0 auto;min-height:calc(100dvh - 46px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{margin:10px 0 2px;font:600 clamp(26px,6vw,40px)/1.2 "Noto Serif","Times New Roman",Cambria,serif;color:var(--ink)}
.sub{margin:0 0 18px;color:var(--gold);font-size:14px;letter-spacing:.04em}
figure{margin:0;width:100%}
figure img{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 18px 50px #0009,0 0 0 1px #e1c28640;background:#0c272b}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:22px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;border:1px solid var(--gold);font:600 15px/1.2 inherit;text-decoration:none;cursor:pointer}
.btn-primary{background:linear-gradient(180deg,#f0d18d,#d6b06a);color:#122d38;border-color:#e9c97f;box-shadow:0 6px 18px #0006}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;color:var(--ink);border-color:#d2b37699}
.btn-ghost:hover{background:#ffffff12}
.btn svg{width:18px;height:18px;flex:none}
@media (max-width:520px){.btn{width:100%}}
</style>
</head>
<body>
<main>
 <h1>Tri ân Thầy Cô · 20.11</h1>
 <p class="sub">Trường THCS Chu Văn An</p>
 <figure>
  <img src="tri-an-thay-co-20-11.jpg" width="2560" height="1808" alt="Tri ân Thầy Cô 20.11 — Trường THCS Chu Văn An">
 </figure>
 <div class="actions">
  <a class="btn btn-primary" href="tri-an-thay-co-20-11.jpg" download="Tri-an-Thay-Co-20-11.jpg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Lưu ảnh</a>
  <button class="btn btn-ghost" type="button" id="share" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>Chia sẻ</button>
 </div>
</main>
<script>
(function(){
 const b=document.getElementById('share');
 if(!navigator.share)return;
 b.hidden=false;
 b.addEventListener('click',function(){
  const url=location.href, title='Tri ân Thầy Cô · 20.11 — THCS Chu Văn An';
  fetch('tri-an-thay-co-20-11.jpg').then(function(r){return r.blob();}).then(function(blob){
   const f=new File([blob],'Tri-an-Thay-Co-20-11.jpg',{type:'image/jpeg'});
   if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:title});
   return navigator.share({title:title,url:url});
  }).catch(function(err){
   // người dùng bấm Hủy → không làm gì; lỗi khác (không gửi được tệp) → chia sẻ đường dẫn, cuối cùng mở ảnh để lưu tay
   if(err&&err.name==='AbortError')return;
   console.warn('Chia sẻ ảnh không thành công, chuyển sang chia sẻ đường dẫn:',err);
   navigator.share({title:title,url:url}).catch(function(e2){
    if(e2&&e2.name==='AbortError')return;
    console.warn('Không chia sẻ được, mở ảnh để lưu:',e2);
    location.href='tri-an-thay-co-20-11.jpg';
   });
  });
 });
})();
</script>
<script>
// 17/11 Thống kê không cookie (GoatCounter): chỉ đếm 1 lượt mở trang này (quét mã QR). Không cookie, không gửi thông tin cá nhân.
// Điền CÙNG mã với GOATCOUNTER_CODE trong src/data/analytics.ts; để trống = tắt.
(function(){const CODE='thcs-chuvanan-ptt';try{const n=navigator;if(!CODE||/^(localhost|127\.)/.test(location.hostname)||n.doNotTrack==='1'||n.globalPrivacyControl===true)return;
const u='https://'+CODE+'.goatcounter.com/count?p='+encodeURIComponent('/tri-an/')+'&t='+encodeURIComponent('Trang lưu ảnh tri ân (quét mã QR)')+'&rnd='+Math.random().toString(36).slice(2,8);
if(!(n.sendBeacon&&n.sendBeacon(u))){const i=new Image();i.referrerPolicy='no-referrer';i.src=u;}}catch(e){console.warn('Không gửi được thống kê lượt xem',e);}})();
</script>
</body>
</html>
